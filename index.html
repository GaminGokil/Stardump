<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stardump</title>
  <style>
    :root {
      --bg-base: #02030a;
      --star-white: #fff5e8;
      --star-gold-mid: #ffc880;
      --star-gold-hot: #ff8a3d;
      --cool-1: #6aa0ff;
      --cool-2: #8fb8ff;
      --nebula-warm: rgba(120, 60, 180, 0.18);
      --nebula-cool: rgba(40, 90, 200, 0.16);
      --ui-text: rgba(255, 245, 232, 0.78);
      --ui-text-dim: rgba(255, 245, 232, 0.42);
      --ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-pop:  cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-fade: cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-base); color: var(--star-white); overflow: hidden; font-family: system-ui, sans-serif; }
    #nebula {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
    }
    #nebula::before, #nebula::after {
      content: ''; position: fixed; inset: 0;
    }
    #nebula::before {
      background: radial-gradient(closest-side at 22% 28%, rgba(150,80,200,0.22), transparent 70%);
    }
    #nebula::after {
      background: radial-gradient(closest-side at 78% 78%, rgba(60,110,220,0.18), transparent 72%);
    }
  </style>
</head>
<body>
  <canvas id="sky" style="position:fixed;inset:0;z-index:1;"></canvas>
  <div id="nebula"></div>
  <script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

let bgStars = [];
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
const smooth = { x: innerWidth / 2, y: innerHeight / 2 };

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function genStars() {
  const count = clamp(Math.floor((innerWidth * innerHeight) / 2800), 100, 300);
  bgStars = [];
  for (let i = 0; i < count; i++) {
    const rnd = Math.random();
    const hue = rnd < 0.12 ? '#ffc880' : rnd < 0.40 ? '#8fb8ff' : '#fff5e8';
    const lrnd = Math.random();
    const layer = lrnd < 0.5 ? 0 : lrnd < 0.8 ? 1 : 2;
    bgStars.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: 0.2 + Math.random() * 0.9,
      layer,
      hue,
      baseAlpha: 0.35 + Math.random() * 0.60,
      phase: Math.random() * Math.PI * 2,
      freq: 0.4 + Math.random() * 0.8,
    });
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  genStars();
}

resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

function loop() {
  requestAnimationFrame(loop);
  const t = performance.now() / 1000;

  smooth.x += (mouse.x - smooth.x) * 0.04;
  smooth.y += (mouse.y - smooth.y) * 0.04;
  const dx = (smooth.x - innerWidth / 2) / (innerWidth / 2);
  const dy = (smooth.y - innerHeight / 2) / (innerHeight / 2);

  ctx.clearRect(0, 0, innerWidth, innerHeight);

  for (const s of bgStars) {
    const alpha = clamp(s.baseAlpha * (0.7 + 0.3 * Math.sin(t * s.freq + s.phase)), 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.hue;
    ctx.beginPath();
    ctx.arc(s.x - dx * s.layer * 4.5, s.y - dy * s.layer * 4.5, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

loop();
  </script>
</body>
</html>
