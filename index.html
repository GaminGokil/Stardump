<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stardump</title>
  <style>
    :root {
      --bg-base: #02030a;
      --star-white: #fff5e8;
      --star-gold-mid: #ffc880;
      --star-gold-hot: #ff8a3d;
      --cool-1: #6aa0ff;
      --cool-2: #8fb8ff;
      --nebula-warm: rgba(120, 60, 180, 0.18);
      --nebula-cool: rgba(40, 90, 200, 0.16);
      --ui-text: rgba(255, 245, 232, 0.78);
      --ui-text-dim: rgba(255, 245, 232, 0.42);
      --ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-pop:  cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-fade: cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-base); color: var(--star-white); overflow: hidden; font-family: system-ui, sans-serif; }
    #nebula {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
    }
    #nebula::before, #nebula::after {
      content: ''; position: fixed; inset: 0;
    }
    #nebula::before {
      background: radial-gradient(closest-side at 22% 28%, rgba(150,80,200,0.22), transparent 70%);
    }
    #nebula::after {
      background: radial-gradient(closest-side at 78% 78%, rgba(60,110,220,0.18), transparent 72%);
    }
    #input-wrap {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10;
    }
    #thought {
      width: 520px; max-width: 80vw;
      background: transparent; color: var(--star-white);
      font-size: 16px; font-family: system-ui, sans-serif;
      padding: 12px 18px;
      border: 1px solid rgba(255,245,232,0.14); border-radius: 999px;
      outline: none;
      transition: border 220ms var(--ease-soft);
    }
    #thought:focus { border-color: rgba(255,245,232,0.35); }
    #thought::placeholder { color: var(--ui-text-dim); }
    #stars { position: fixed; inset: 0; z-index: 3; pointer-events: none; transform-origin: 0 0; will-change: transform; }
    .star { position: absolute; width: 12px; height: 12px; margin-left: -6px; margin-top: -6px; cursor: pointer; pointer-events: auto; }
    .star-core {
      position: absolute; left: 4px; top: 4px; width: 4px; height: 4px;
      border-radius: 50%; background: var(--star-white);
      box-shadow: 0 0 8px var(--star-white), 0 0 18px var(--star-gold-mid), 0 0 32px var(--star-gold-hot);
    }
    .star-glow {
      position: absolute; left: -12px; top: -12px; width: 36px; height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,200,128,0.55), transparent 70%);
      pointer-events: none;
    }
    @keyframes star-in {
      0%   { opacity: 0; transform: scale(0.6); }
      70%  { opacity: 1; transform: scale(1.12); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes star-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.78; }
    }
    .star:hover .star-glow { transform: scale(1.4); transition: transform 280ms var(--ease-soft); }
    .tooltip {
      position: absolute; top: -8px; left: 20px; transform: translateY(-100%);
      min-width: 180px; max-width: 280px;
      background: rgba(10,12,28,0.88); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,245,232,0.10); border-radius: 10px;
      padding: 10px 12px; color: var(--star-white); font-size: 13px;
      z-index: 20; pointer-events: auto;
    }
    .tooltip-text {
      margin: 0 0 8px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tooltip-resolve {
      background: transparent; border: 1px solid rgba(255,200,128,0.4);
      color: var(--star-gold-mid); padding: 4px 10px; border-radius: 999px;
      cursor: pointer; font-size: 12px; font-family: system-ui, sans-serif;
      transition: border-color 180ms var(--ease-soft), color 180ms var(--ease-soft);
    }
    .tooltip-resolve:hover { border-color: var(--star-gold-hot); color: var(--star-gold-hot); }
    @keyframes nova-core {
      0%   { transform: scale(1);  background: var(--star-white);    box-shadow: 0 0 6px var(--star-white), 0 0 14px var(--star-gold-mid); }
      30%  { transform: scale(5);  background: var(--star-gold-mid); box-shadow: 0 0 30px var(--star-gold-mid), 0 0 60px var(--star-gold-hot); }
      65%  { transform: scale(11); background: var(--star-gold-hot); box-shadow: 0 0 80px var(--star-gold-hot), 0 0 140px rgba(255,138,61,0.6); }
      100% { transform: scale(14); background: var(--star-gold-hot); opacity: 0; }
    }
    @keyframes nova-glow {
      0%   { width: 36px;  height: 36px;  left: -12px; top: -12px; opacity: 1; }
      60%  { width: 140px; height: 140px; left: -64px; top: -64px; opacity: 0.9; }
      100% { width: 200px; height: 200px; left: -94px; top: -94px; opacity: 0; }
    }
    .star.supernova .star-core {
      animation: nova-core 1.8s var(--ease-fade) forwards !important;
    }
    .star.supernova .star-glow {
      animation: nova-glow 1.8s var(--ease-fade) forwards !important;
    }
    .nova-particle {
      position: absolute; left: 6px; top: 6px; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
      border-radius: 50%; background: var(--star-gold-mid);
      box-shadow: 0 0 6px var(--star-gold-hot); opacity: 0;
    }
    .star.supernova .nova-particle {
      animation: nova-particle 1.6s var(--ease-fade) forwards;
    }
    @keyframes nova-particle {
      0%   { transform: translate(0,0) scale(0.4); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.6); opacity: 0; }
    }
    #constellation { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    .c-line { opacity: 0; animation: c-line-in 900ms var(--ease-soft) forwards; }
    @keyframes c-line-in { to { opacity: 1; } }
    #constellation-name {
      position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
      font-family: Georgia, serif; font-style: italic; font-size: 26px;
      letter-spacing: 3px; color: rgba(255,245,232,0.55);
      pointer-events: none; z-index: 10;
      opacity: 0;
      transition: opacity 600ms var(--ease-soft);
    }
    #brand {
      position: fixed; top: 24px; left: 28px; z-index: 10;
      font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--ui-text-dim); pointer-events: none;
    }
    #counter {
      position: fixed; top: 24px; right: 28px; z-index: 10;
      font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
      color: var(--ui-text-dim); pointer-events: none;
    }
    body { cursor: grab; }
    body.panning { cursor: grabbing; }
    #welcome {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      background: rgba(2, 3, 10, 0.62);
      opacity: 0; pointer-events: none;
      transition: opacity 600ms var(--ease-soft);
    }
    #welcome.show { opacity: 1; pointer-events: auto; }
    #welcome-inner { max-width: 440px; padding: 0 24px; text-align: center; }
    #welcome-title {
      margin: 0 0 18px; font-weight: 400;
      font-size: 28px letter-spacing: 6px; color: var(--star-white);
    }
    #welcome-inner p {margin: 0 0 12px; font-size: 15px; line-height: 1.6; color: var(--ui-text); }
    #welcome-begin {
      display: inline-clock; margin-top: 18px;
      font-size: 15px; letter-spacing: 2px; cursor: pointer;
      color: var(--ui-text-dim);
      transition: color 220ms var(--ease-soft);
    }
    #welcome-begin:hover { color: var(--star-gold-mid); }
  </style>
</head>
<body>
  <div id="brand">stardump</div>
  <div id="counter"></div>
  <canvas id="sky" style="position:fixed;inset:0;z-index:1;"></canvas>
  <div id="nebula"></div>
  <div id="stars"></div>
  <svg id="constellation" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="constellation-name"></div>
  <div id="input-wrap">
    <input id="thought" type="text" maxlength="120" autocomplete="off"
           placeholder="drop a thought into the sky...">
  </div>
  <div id="welcome">
    <div id="welcome-inner">
      <h1 id="welcome-title">stardump</h1>
      <p>a place to set your worries down.</p>
      <p>type a thought - it becomes a star. five make a constellation that's yours.</p>
      <p>wehn a worry passes, let its star go supernova.</p>
      <span id="welcome-begin">begin ✦<</span>
    </div>
  </div>
  <script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

let bgStars = [];
let tileW = 0, tileH = 0;
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
const smooth = { x: innerWidth / 2, y: innerHeight / 2 };

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

const LAYER_P = [0.30, 0.55, 0.80];
function bgScale() { return 1 + (view.scale - 1) * 0.5; }

function genStars() {
  tileW = innerWidth * 2;
  tileH = innerHeight * 2;
  const count = clamp(Math.floor((tileW * tileH) / 2800), 200, 900);
  bgStars = [];
  for (let i = 0; i < count; i++) {
    const rnd = Math.random();
    const hue = rnd < 0.12 ? '#ffc880' : rnd < 0.40 ? '#8fb8ff' : '#fff5e8';
    const lrnd = Math.random();
    const layer = lrnd < 0.5 ? 0 : lrnd < 0.8 ? 1 : 2;
    bgStars.push({
      x: Math.random() * tileW,
      y: Math.random() * tileH,
      r: 0.4 + Math.random() * 1.3,
      layer,
      hue,
      baseAlpha: 0.35 + Math.random() * 0.60,
      phase: Math.random() * Math.PI * 2,
      freq: 0.4 + Math.random() * 0.8,
    });
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  genStars();
}

resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

window.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  moved = false;
  if (e.target.closest('#input-wrap, .tooltip, .star')) return;
  isDown = true;
  downX = e.clientX;
  downY = e.clientY;
  startOx = view.ox;
  startOy = view.oy;
});

window.addEventListener('mousemove', e => {
  if (!isDown) return;
  const ddx = e.clientX - downX, ddy = e.clientY - downY;
  if (!moved && Math.hypot(ddx, ddy) > 4) {
    moved = true;
    document.body.classList.add('panning');
  }
  if (moved) {
    view.ox = startOx - ddx / view.scale;
    view.oy = startOy - ddy / view.scale;
    applyView();
  }
});

window.addEventListener('mouseup', () => {
  isDown = false;
  document.body.classList.remove('panning');
  if (moved) saveState();
});

window.addEventListener('wheel', e => {
  e.preventDefault();
  const wx = s2wx(e.clientX), wy = s2wy(e.clientY);
  view.scale = clamp(view.scale * Math.exp(-e.deltaY * 0.0015), 0.4, 3);
  view.ox = wx - e.clientX / view.scale;
  view.oy = wy - e.clientY / view.scale;
  applyView();
  clearTimeout(zoomSaveT);
  zoomSaveT = setTimeout(saveState, 400);
}, { passive: false });

function loop() {
  requestAnimationFrame(loop);
  const t = performance.now() / 1000;

  smooth.x += (mouse.x - smooth.x) * 0.04;
  smooth.y += (mouse.y - smooth.y) * 0.04;
  const dx = (smooth.x - innerWidth / 2) / (innerWidth / 2);
  const dy = (smooth.y - innerHeight / 2) / (innerHeight / 2);

  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const bs = bgScale();
  const TW = tileW * bs, TH = tileH * bs;

  for (const s of bgStars) {
    const alpha = clamp(s.baseAlpha * (0.7 + 0.3 * Math.sin(t * s.freq + s.phase)), 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.hue;
    const p = LAYER_P[s.layer];
    const offX = view.ox * p - dx * (s.layer + 1) * 12;
    const offY = view.oy * p - dy * (s.layer + 1) * 12;
    const r = s.r * bs;
    let bx = (((s.x - offX) * bs) % TW + TW) % TW;
    let by = (((s.y - offY) * bs) % TH + TH) % TH;
    ctx.beginPath();
    for (let gx = bx - TW; gx < innerWidth + TW; gx += TW) {
      if (gx + r < 0 || gx - r > innerWidth) continue;
      for (let gy = by - TH; gy < innerHeight + TH; gy += TH) {
        if (gy + r < 0 || gy - r > innerHeight) continue;
        ctx.moveTo(gx + r, gy);
        ctx.arc(gx, gy, r, 0, Math.PI * 2);
      }
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const STATE = { stars: [], nextId: 0, seenWelcome: false };

const view = { ox: 0, oy: 0, scale: 1 };

loop();

let isDown = false, moved = false, downX = 0, downY = 0, startOx = 0, startOy = 0;
let zoomSaveT;

const LS_KEY = 'stardump-v1-sky';

const animatedIds = new Set();

function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ stars: STATE.stars, nextId: STATE.nextId, seenWelcome: STATE.seenWelcome, view: { ox: view.ox, oy: view.oy, scale: view.scale } })); } catch (_) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.stars)) STATE.stars = data.stars;
    if (typeof data.nextId === 'number') STATE.nextId = data.nextId;
    STATE.seenWelcome = !!data.seenWelcome;
    if (data.view) {
      view.ox = +data.view.ox || 0;
      view.oy = +data.view.oy || 0;
      view.scale = clamp(+data.view.scale || 1, 0.4, 3);
    }
    for (const s of STATE.stars) animatedIds.add(s.id);
  } catch (_) {}
}

function placeStar() {
  const M = 70;
  const wx0 = view.ox + M / view.scale;
  const wx1 = view.ox + (innerWidth - M) / view.scale;
  const wy0 = view.oy + M / view.scale;
  const wy1 = view.oy + (innerHeight - M - 80) / view.scale;
  for (let attempt = 0; attempt < 60; attempt++) {
    const x = wx0 + Math.random() * (wx1 - wx0);
    const y = wy0 + Math.random() * (wy1 - wy0);
    if (STATE.stars.every(s => Math.hypot(s.x - x, s.y - y) >= 90)) return { x, y };
  }
  return {
    x: wx0 + Math.random() * (wx1 - wx0),
    y: wy0 + Math.random() * (wy1 - wy0),
  };
}

function addThoughtStar(text) {
  const pos = placeStar();
  STATE.stars.push({ id: STATE.nextId++, x: pos.x, y: pos.y, text: text.slice(0, 120), createdAt: Date.now() });
  renderStars();
  saveState();
}

function renderStars() {
  const container = document.getElementById('stars');
  const existing = new Map();
  for (const el of container.children) existing.set(+el.dataset.id, el);

  for (const s of STATE.stars) {
    if (!existing.has(s.id)) {
      const el = document.createElement('div');
      el.className = 'star';
      el.dataset.id = s.id;
      el.style.left = s.x + 'px';
      el.style.top = s.y + 'px';
      el.innerHTML = '<div class="star-glow"></div><div class="star-core"></div>';
      container.appendChild(el);
      const dur = (3.4 + Math.random() * 2.2).toFixed(2);
      const delay = (-Math.random() * 5).toFixed(2);
      if (!animatedIds.has(s.id)) {
        el.style.animation = `star-in 1.5s var(--ease-pop) both, star-pulse ${dur}s var(--ease-soft) ${delay}s infinite`;
        animatedIds.add(s.id);
      } else {
        el.style.animation = `star-pulse ${dur}s var(--ease-soft) ${delay}s infinite`;
      }
      existing.set(s.id, el);
    }
  }

  const activeIds = new Set(STATE.stars.map(s => s.id));
  for (const [id, el] of existing) {
    if (!activeIds.has(id)) el.remove();
  }
  renderConstellation();
  updateCounter();
}

function renderConstellation() {
  const svg = document.getElementById('constellation');
  const nameEl = document.getElementById('constellation-name');
  let g = document.getElementById('cgroup');
  if (!g) {
    g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'cgroup';
    svg.appendChild(g);
  }
  g.innerHTML = '';
  if (STATE.stars.length < 5) { nameEl.style.opacity = '0'; applyView(); return; }
  const edges = new Set();
  for (const a of STATE.stars) {
    const sorted = STATE.stars
      .filter(b => b.id !== a.id)
      .sort((b, c) => Math.hypot(b.x - a.x, b.y - a.y) - Math.hypot(c.x - a.x, c.y - a.y));
    for (const b of sorted.slice(0, 2)) {
      const key = [a.id, b.id].sort((x, y) => x - y).join('-');
      edges.add(key + ':' + a.x + ',' + a.y + ':' + b.x + ',' + b.y);
    }
  }
  let i = 0;
  for (const edge of edges) {
    const parts = edge.split(':');
    const [ax, ay] = parts[1].split(',').map(Number);
    const [bx, by] = parts[2].split(',').map(Number);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', ax); line.setAttribute('y1', ay);
    line.setAttribute('x2', bx); line.setAttribute('y2', by);
    line.setAttribute('stroke', 'rgba(255,245,232,0.18)');
    line.setAttribute('stroke-width', '0.6');
    line.classList.add('c-line');
    line.style.animationDelay = `${i * 70}ms`;
    g.appendChild(line);
    i++;
  }
  const name = constellationName(STATE.stars);
  nameEl.textContent = name;
  nameEl.style.opacity = name ? '1' : '0';
  applyView();
}

function constellationName(stars) {
  if (stars.length < 5) return '';
  const blob = stars.map(s => s.text.toLowerCase()).join(' ');
  const TAGS = {
    school:  /\b(school|class|exam|test|hw|homework|teacher|study|grade|essay|gpa|sat|act|college app)\b/,
    social:  /\b(friend|friends|group chat|gc|party|text|texted|dms?|snapchat|instagram|crush|left on read|seen|ignored)\b/,
    sleep:   /\b(sleep|tired|insomnia|2am|3am|cant sleep|can't sleep|awake|nap)\b/,
    future:  /\b(future|career|college|major|job|life|after|next year|graduation|what if)\b/,
    romance: /\b(crush|date|dating|love|like.*him|like.*her|relationship|breakup|broke up|ex)\b/,
    home:    /\b(mom|dad|parent|parents|family|home|sister|brother|sibling|dinner)\b/,
    body:    /\b(weight|fat|skinny|ugly|skin|acne|hair|body|mirror|gym)\b/,
    money:   /\b(money|broke|cash|afford|expensive|job|paycheck|bills?)\b/,
  };
  const active = new Set(Object.entries(TAGS).filter(([, r]) => r.test(blob)).map(([t]) => t));
  const has = (...tags) => tags.every(t => active.has(t));
  if (has('school','social'))  return 'The Eight-Tab Mind';
  if (has('sleep'))            return 'The Sleepless Cipher';
  if (has('school','future'))  return 'The Half-Finished Future';
  if (has('social','romance')) return 'The Unread Heart';
  if (has('romance'))          return 'The Quiet Pining';
  if (has('home'))             return 'The Kitchen-Table Worrier';
  if (has('body'))             return 'The Mirror Watcher';
  if (has('money'))            return 'The Anxious Ledger';
  if (has('social'))           return 'The Unread Group Chat';
  if (has('school'))           return 'The Restless Scholar';
  if (has('future'))           return 'The Open Loop';
  const pool = ['Caffeinated Spiral','Soft Static','2AM Drift','Tangled Constellation','Quiet Worrier','Burnt-Out Wanderer','Anxious Cartographer','Procrastinator','Sunday Scaries'];
  const idx = stars.reduce((acc, s) => acc + s.text.length * (s.id + 1), 0) % pool.length;
  return pool[idx];
}

function updateCounter() {
  const el = document.getElementById('counter');
  const n = STATE.stars.length;
  if (n === 0) { el.textContent = ''; return; }
  const name = constellationName(STATE.stars);
  el.textContent = name ? `${n} stars · ${name}` : `${n} stars`;
}

document.getElementById('thought').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const text = e.target.value.trim();
  if (text) { addThoughtStar(text); e.target.value = ''; }
});

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

let openTooltip = null;

function closeTooltip() {
  if (openTooltip) { openTooltip.remove(); openTooltip = null; }
}

function dismissWelcome() {
  const w = document.getElementById('welcome');
  if (!w) return;
  w.classList.remove('show');
  STATE.seenWelcome = true;
  saveState();
  setTimeout(() => w.remove(), 600);
}

function maybeShowWelcome() {
  const w = document.getElementById('welcome');
  if (!w) return;
  if (STATE.seenWelcome || STATE.stars.length > 0) { w.remove(); return; }
  document.getElementById('welcome-begin').addEventListener('click', dismissWelcome);
  setTimeout(() => w.classList.add('show'), 350);
}

function s2wx(sx) { return sx / view.scale + view.ox; }
function s2wy(sy) { return sy / view.scale + view.oy; }

function applyView() {
  const t = view.scale;
  document.getElementById('stars').style.transform =
    `scale(${t}) translate(${-view.ox}px, ${-view.oy}px)`;
  const g = document.getElementById('cgroup');
  if (g) g.setAttribute('transform', `scale(${t}) translate(${-view.ox} ${-view.oy})`);
  if (openTooltip) openTooltip.style.transform = `translateY(-100%) scale(${1/t})`;
}

function easeK(k) { return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }

function glideTo(tx, ty, ts) {
  const sox = view.ox, soy = view.oy, ss = view.scale, t0 = performance.now(), dur = 600;
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur), e = easeK(k);
    view.ox = sox + (tx - sox) * e;
    view.oy = soy + (ty - soy) * e;
    view.scale = ss + (ts - ss) * e;
    applyView();
    if (k < 1) requestAnimationFrame(step); else saveState();
  })(performance.now());
}

function recenter() {
  let tx = 0, ty = 0;
  const ts = 1;
  if (STATE.stars.length) {
    const cx = STATE.stars.reduce((a, s) => a + s.x, 0) / STATE.stars.length;
    const cy = STATE.stars.reduce((a, s) => a + s.y, 0) / STATE.stars.length;
    tx = cx - (innerWidth / ts) / 2;
    ty = cy - (innerHeight / ts) / 2;
  }
  glideTo(tx, ty, ts);
}

window.addEventListener('dblclick', e => {
  if (e.target.closest('.star, #input-wrap, .tooltip')) return;
  recenter();
});

function removeStar(id) {
  STATE.stars = STATE.stars.filter(s => s.id !== id);
  renderStars();
  saveState();
}

function triggerSupernova(id) {
  closeTooltip();
  const starEl = document.querySelector(`.star[data-id="${id}"]`);
  if (starEl) {
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2 + (Math.random() * 0.15);
      const dist = 90 + Math.random() * 60;
      const p = document.createElement('span');
      p.className = 'nova-particle';
      p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
      p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
      starEl.appendChild(p);
    }
    starEl.classList.add('supernova');
  }
  setTimeout(() => removeStar(id), 2000);
}

document.addEventListener('click', e => {
  if (openTooltip && !openTooltip.contains(e.target)) closeTooltip();
});

document.getElementById('stars').addEventListener('click', e => {
  if (moved) return;
  const starEl = e.target.closest('.star');
  if (!starEl) return;
  e.stopPropagation();
  closeTooltip();
  const id = +starEl.dataset.id;
  const star = STATE.stars.find(s => s.id === id);
  if (!star) return;
  const tip = document.createElement('div');
  tip.className = 'tooltip';
  tip.innerHTML = `<p class="tooltip-text">${escapeHtml(star.text)}</p><button class="tooltip-resolve">mark as resolved ✦</button>`;
  tip.querySelector('.tooltip-resolve').addEventListener('click', ev => {
    ev.stopPropagation();
    closeTooltip();
    triggerSupernova(id);
  });
  tip.style.transformOrigin = 'left bottom';
  tip.style.transform = `translateY(-100%) scale(${1 / view.scale})`;
  starEl.appendChild(tip);
  openTooltip = tip;
});

loadState();
renderStars();
applyView();
maybeShowWelcome();
  </script>
</body>
</html>
